<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090C"/>
      <stop offset="50%" stop-color="#0E1318"/>
      <stop offset="100%" stop-color="#06080B"/>
    </linearGradient>

    <!-- Accent Mint Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2FE5A7"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <radialGradient id="glowMint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2FE5A7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2FE5A7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2FE5A7" stroke-width="1" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="16" fill="url(#grid)"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="200" cy="100" r="220" fill="url(#glowMint)"/>
  <circle cx="1000" cy="280" r="260" fill="url(#glowBlue)"/>

  <!-- Border Outline -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#2FE5A7" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Top Badges / Micro Label -->
  <g transform="translate(80, 56)">
    <!-- Status Pill -->
    <rect width="210" height="30" rx="15" fill="#2FE5A7" fill-opacity="0.08" stroke="#2FE5A7" stroke-opacity="0.3"/>
    <circle cx="16" cy="15" r="4.5" fill="#2FE5A7"/>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2FE5A7" letter-spacing="1.5">KATHMANDU · NEPAL</text>

    <g transform="translate(225, 0)">
      <rect width="190" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="16" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#E4E4E7" letter-spacing="1">SYSTEMS · AI · GROWTH</text>
    </g>
  </g>

  <!-- Main Hero Brand Name -->
  <g transform="translate(80, 160)">
    <!-- Icon Symbol -->
    <rect x="0" y="-38" width="48" height="48" rx="12" fill="#2FE5A7" fill-opacity="0.12" stroke="#2FE5A7" stroke-opacity="0.4"/>
    <path d="M 24 -28 L 15 -12 L 23 -12 L 20 2 L 33 -16 L 25 -16 Z" fill="url(#mintGrad)"/>

    <text x="64" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Space Grotesk', Roboto, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Provix<tspan fill="url(#mintGrad)">Tech</tspan></text>
  </g>

  <!-- Subheadline -->
  <text x="80" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#A1A1AA">Custom ERP Platforms · Intelligent AI Solutions · High-Impact Growth</text>

  <!-- Bottom Capability Cards -->
  <g transform="translate(80, 260)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="240" height="68" rx="10" fill="#13171F" stroke="#262D38" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#2FE5A7" letter-spacing="0.5">01 · ENTERPRISE ERP</text>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">Tailored operations &amp; finance</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(260, 0)">
      <rect width="240" height="68" rx="10" fill="#13171F" stroke="#262D38" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#2FE5A7" letter-spacing="0.5">02 · AI AGENTS &amp; APIS</text>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">Automations &amp; custom bots</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(520, 0)">
      <rect width="240" height="68" rx="10" fill="#13171F" stroke="#262D38" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#2FE5A7" letter-spacing="0.5">03 · FULLSTACK WEB</text>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">Fast, reactive Next.js apps</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(780, 0)">
      <rect width="240" height="68" rx="10" fill="#13171F" stroke="#262D38" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#2FE5A7" letter-spacing="0.5">04 · META ADS &amp; SEO</text>
      <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94A3B8">Targeted ROI campaigns</text>
    </g>
  </g>
</svg>
